<h2 mat-dialog-title class="text-center">New Note</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="flex flex-col">
        <mat-form-field class="flex-1">
            <mat-label>Note Title</mat-label>
            <input matInput placeholder="Title" formControlName="title" />
        </mat-form-field>

        <mat-form-field class="flex-1">
            <textarea
                matInput
                cdkTextareaAutosize
                placeholder="body..."
                formControlName="body"
                cdkAutosizeMinRows="5"
            ></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="onSubmit()">Save</button>
    <button matButton mat-dialog-close>Cancel</button>
</mat-dialog-actions>
