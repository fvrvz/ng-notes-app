<h2 mat-dialog-title>New Note</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="container-fluid">
        <div>
            <mat-form-field>
                <mat-label>Note Title</mat-label>
                <input matInput placeholder="Title" formControlName="title" />
            </mat-form-field>
        </div>
        <div>
            <mat-form-field>
                <textarea matInput placeholder="body..." formControlName="body"></textarea>
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="onSubmit()">Save</button>
    <button matButton mat-dialog-close>Cancel</button>
</mat-dialog-actions>
