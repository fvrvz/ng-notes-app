<footer>
    <nav>
        <ul>
            @for(option of options(); track option.id) {
            <li>
                <app-icon-button
                    [icon]="option.icon"
                    [navigateTo]="option.routerLink"
                    [id]="option.id"
                    [label]="option.title"
                    [size]="option.iconSize"
                />
            </li>
            }
        </ul>
    </nav>
</footer>
