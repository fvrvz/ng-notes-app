@if(options().length === 0) {
<p>No Links</p>
} @else {
<nav class="pico-background-slate-750">
    <ul class="container-fluid">
        @for(option of options(); track option.routerLink) {
        <li><a class="pico-color-zinc-50" [routerLink]="option.routerLink" [id]="option.id">{{option.title}}</a></li>
        }
    </ul>
</nav>
}
<section class="container-fluid">
    <router-outlet />
</section>
